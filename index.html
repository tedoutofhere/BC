<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Verhoef — PVFILMS1</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
 
  :root {
    --black: #080808;
    --deep: #0f0f0f;
    --border: rgba(255,255,255,0.07);
    --gold: #c8a96e;
    --gold-dim: rgba(200,169,110,0.4);
    --white: #f0ece4;
  }
 
  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
 
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }
 
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
 
  .card {
    position: relative;
    width: min(480px, 96vw);
    background: var(--deep);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 56px 52px 48px;
    z-index: 1;
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 40px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }
 
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 52px; right: 52px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.7;
  }
 
  .corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--gold-dim);
    border-style: solid;
  }
  .corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }
 
  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
    margin-bottom: 22px;
  }
 
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(46px, 11vw, 62px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.9),
      0 0 16px rgba(255, 255, 255, 0.6),
      0 0 28px rgba(255, 255, 255, 0.35);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }
 
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    margin-top: 14px;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.75s forwards;
  }
 
  .tagline p {
    margin: 0;
    line-height: 1.7;
  }
 
  .glow-white {
    color: #ffffff;
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.9),
      0 0 16px rgba(255, 255, 255, 0.6),
      0 0 28px rgba(255, 255, 255, 0.35);
  }
 
  .tagline .headline { font-size: 17px; }
  .tagline .freelance { font-size: 15px; margin-top: 2px; }
  .tagline .location { font-size: 15px; margin-top: 2px; }
 
  .divider {
    width: 44px;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin: 30px 0;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.85s forwards;
  }
 
  .contacts {
    display: flex;
    flex-direction: column;
    gap: 16px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.95s forwards;
  }
 
  .contact-item {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 0.05em;
    transition: color 0.2s ease;
  }
 
  .contact-item:hover { color: var(--gold); }
  .contact-item:hover .icon-wrap { border-color: var(--gold-dim); }
 
  .contact-item .phone-number {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.12em;
  }
 
  .icon-wrap {
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s ease;
  }
 
  .icon-wrap svg {
    width: 16px; height: 16px;
    fill: var(--gold);
    opacity: 0.85;
  }
 
  .footer {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }
 
  .footer-brand {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.9);
  }
 
  .save-btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    background: none;
    border: 1px solid var(--gold-dim);
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 1px;
    transition: background 0.2s, color 0.2s;
  }
 
  .save-btn:hover {
    background: var(--gold);
    color: var(--black);
  }
 
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
