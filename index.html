<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Verhoef — PV Films</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Archivo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --deep: #0f0f0f;
    --surface: #161616;
    --border: rgba(255,255,255,0.07);
    --gold: #c8a96e;
    --gold-dim: rgba(200,169,110,0.4);
    --white: #f0ece4;
    --muted: rgba(240,236,228,0.45);
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'Archivo', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }

  /* Ambient light leak */
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    width: min(420px, 94vw);
    background: var(--deep);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 48px 44px 40px;
    z-index: 1;
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 40px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* Top gold accent line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 44px; right: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.7;
  }

  /* Corner marks */
  .corner {
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--gold-dim);
    border-style: solid;
  }
  .corner.tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

  .eyebrow {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
    margin-bottom: 20px;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(38px, 9vw, 52px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--white);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .name em {
    font-style: italic;
    color: rgba(240,236,228,0.7);
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-style: italic;
    font-weight: 300;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.75s forwards;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin: 28px 0;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.85s forwards;
  }

  .contacts {
    display: flex;
    flex-direction: column;
    gap: 14px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.95s forwards;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--white);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.03em;
    transition: color 0.2s ease;
  }

  .contact-item:hover { color: var(--gold); }
  .contact-item:hover .icon-wrap { border-color: var(--gold-dim); }

  .icon-wrap {
    width: 32px; height: 32px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s ease;
  }

  .icon-wrap svg {
    width: 14px; height: 14px;
    fill: var(--gold);
    opacity: 0.85;
  }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }

  .footer-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.5);
  }

  .save-btn {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    background: none;
    border: 1px solid var(--gold-dim);
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 1px;
    font-family: 'Archivo', sans-serif;
    transition: background 0.2s, color 0.2s;
  }

  .save-btn:hover {
    background: var(--gold);
    color: var(--black);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="eyebrow">Photography</div>

  <div class="name">Paul<br><em>Verhoef</em></div>
  <div class="tagline">Every frame, a moment worth remembering.</div>

  <div class="divider"></div>

  <div class="contacts">
    <a class="contact-item" href="tel:0416571969">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
      </div>
      0416 571 969
    </a>

    <a class="contact-item" href="mailto:pvfilms1@icloud.com">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      pvfilms1@icloud.com
    </a>

    <a class="contact-item" href="https://instagram.com/pvfilms1" target="_blank">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </div>
      pvfilms1
    </a>
  </div>

  <div class="footer">
    <span class="footer-brand">PV Films</span>
    <button class="save-btn" onclick="saveContact()">Save Contact</button>
  </div>
</div>

<script>
function saveContact() {
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Paul Verhoef
ORG:PV Films
TEL:0416571969
EMAIL:pvfilms1@icloud.com
URL:https://instagram.com/pvfilms1
NOTE:Every frame, a moment worth remembering.
END:VCARD`;

  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'paul-verhoef.vcf';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
